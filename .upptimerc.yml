# Upptime configuration — https://upptime.js.org/docs/configuration
#
# Upptime reads THIS file, at the repository root. The workflows under
# .github/workflows/ come from the upstream template and are regenerated by
# "Setup CI" whenever this file changes; edit the config, never the workflows.
owner: Foly-Investment
repo: foly-status
assignees:
  - shikigami12

sites:
  - name: Foly API
    url: https://api.foly.app/healthz
    method: GET
    expectedStatusCodes:
      - 200
    # Down when the body stops saying healthy, not only on a non-200.
    # Body contract (Foly.Api Program.cs, /healthz): {"status":"healthy","timestamp":"..."}
    __dangerous__body_down_if_text_missing: '"status":"healthy"'
  - name: Foly App
    # The root of app.foly.app 302s to the served locale bundle; probe the bundle itself.
    url: https://app.foly.app/en-US/
    expectedStatusCodes:
      - 200
  - name: Foly Marketing
    url: https://foly.app
    expectedStatusCodes:
      - 200

status-website:
  cname: status.foly.app
  name: Foly Status
  logoUrl: https://foly.app/logo.svg
  theme: dark
  introTitle: "Foly service status"
  introMessage: "Live status of the Foly app, API and website, checked every five minutes from GitHub Actions."
  navbar:
    - title: Status
      href: /
    - title: Foly App
      href: https://app.foly.app
    - title: Website
      href: https://foly.app
